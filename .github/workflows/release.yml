---
name: Release
on:
  push:
    tags: [v*]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  build-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      # PyInstaller is a packaging-only dependency, so it is injected here
      # instead of pinning it into the dev group.
      - run: uv run --with pyinstaller python -m PyInstaller labelme.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: labelme-windows
          path: dist/labelme.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheel, build-executable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: labelme-windows
          path: dist
      - name: Extract release notes from CHANGELOG
        run: |-
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## $version " 'index($0, heading) == 1 {found = 1; next}
            found && /^## / {exit} found' CHANGELOG.md > notes.md
          test -s notes.md || printf 'Release %s\n' "$GITHUB_REF_NAME" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/labelme.exe
            dist/*.whl
            dist/*.tar.gz
          body_path: notes.md
